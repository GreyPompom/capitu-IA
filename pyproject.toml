[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capitu-ia"
version = "0.1.0"
description = "Chatbot inteligente de descoberta bibliográfica CAPITU"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2,<3",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "scikit-learn>=1.5,<2",
  "pandas>=2.2,<3",
]

[project.optional-dependencies]
dev = ["httpx2>=2,<3", "pytest>=8,<9", "pytest-cov>=5,<8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "nlp*", "dialogue*", "services*", "responses*"]
