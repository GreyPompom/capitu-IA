[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capitu-ia"
version = "0.1.0"
description = "Chatbot inteligente de descoberta bibliográfica CAPITU"
requires-python = ">=3.10"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "httpx",
  "scikit-learn",
  "pandas",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "nlp*", "dialogue*", "services*", "responses*"]
